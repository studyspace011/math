<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Base Pro - Ultimate</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0;
            --primary: #2563eb; --fast: #22c55e; --mid: #f59e0b; --slow: #ef4444;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155;
            --primary: #3b82f6;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; transition: 0.3s; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .screen { display: none; }
        .active { display: block; }

        button { padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; margin: 5px 0; width: 100%; }
        .btn-main { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-dl { background: #059669; color: white; margin-top: 15px; }

        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); }

        .question-box { font-size: 4rem; font-weight: 800; text-align: center; margin: 40px 0; }
        .timer-bar { display: flex; justify-content: space-between; font-weight: bold; background: var(--bg); padding: 10px; border-radius: 8px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: center; }
        
        .tag { padding: 4px 8px; border-radius: 6px; color: white; font-weight: bold; font-size: 0.85rem; }
        .mode-toggle { cursor: pointer; font-size: 1.5rem; background: none; border: none; color: var(--text); width: auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0;">Math Strong 🚀</h2>
        <button class="mode-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>

    <!-- Setup Screen -->
    <div id="setup" class="screen active">
        <label>Stage Select:</label>
        <select id="stageSelect">
            <option value="1">Stage 1: Single Digit</option>
            <option value="2">Stage 2: Double Digit</option>
            <option value="3">Stage 3: Base Numbers (10, 20, 50...)</option>
            <option value="4">Stage 4: Under 100 Sum</option>
            <option value="5">Stage 5: Double Digit 100+</option>
            <option value="6">Stage 6: Near Base (295, 399...)</option>
            <option value="7">Stage 7: 3+4 Digit Sum</option>
        </select>
        <label>Questions Count:</label>
        <input type="number" id="qCount" value="10" min="1">
        <button class="btn-main" onclick="startTest()">Start Training</button>
        <button class="btn-outline" onclick="showHistory()">View Long-Term Progress</button>
    </div>

    <!-- Game Screen -->
    <div id="game" class="screen">
        <div class="timer-bar">
            <span>Q: <span id="qNum">1</span>/<span id="qTotal">10</span></span>
            <span id="liveTimer" style="color:var(--slow)">0.0s</span>
        </div>
        <div id="questionDisplay" class="question-box">-- + --</div>
        <input type="number" id="mathInput" placeholder="Type answer..." autofocus>
    </div>

    <!-- Result Screen -->
    <div id="result" class="screen">
        <h3>Session Report</h3>
        <p>Average Speed: <b id="avgRes">0</b>s</p>
        <div style="max-height: 300px; overflow-y: auto;">
            <table>
                <thead><tr><th>Q.</th><th>Solve</th><th>Time</th></tr></thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>
        <button class="btn-dl" onclick="downloadResult()">Download Result (CSV)</button>
        <button class="btn-main" onclick="resetApp()">Try Again</button>
    </div>

    <!-- History Screen -->
    <div id="history" class="screen">
        <h3>Progress Graph</h3>
        <canvas id="historyChart"></canvas>
        <button class="btn-outline" onclick="resetApp()">Back</button>
    </div>
</div>

<script>
    let currentCount, totalQs, correctAnswer, qStartTime, timerInt;
    let sessionLogs = [];
    let historyData = JSON.parse(localStorage.getItem('math_pro_history')) || [];

    // Theme Toggle
    function toggleTheme() {
        const body = document.documentElement;
        if(body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            document.getElementById('themeBtn').innerText = '🌙';
        } else {
            body.setAttribute('data-theme', 'dark');
            document.getElementById('themeBtn').innerText = '☀️';
        }
    }

    function startTest() {
        totalQs = parseInt(document.getElementById('qCount').value);
        currentCount = 1; sessionLogs = [];
        showScreen('game');
        document.getElementById('qTotal').innerText = totalQs;
        nextQuestion();
    }

    function nextQuestion() {
        if(currentCount > totalQs) return showResults();
        let stage = parseInt(document.getElementById('stageSelect').value);
        let n1, n2;
        if(stage==1){n1=r(1,9); n2=r(1,9);}
        else if(stage==2){n1=r(10,99); n2=r(10,99);}
        else if(stage==3){n1=[10,20,50,100,500][r(0,4)]; n2=r(11,99);}
        else if(stage==4){n1=r(10,80); n2=r(5,100-n1);}
        else if(stage==5){n1=r(55,99); n2=r(55,99);}
        else if(stage==6){let b=[100,200,300,500][r(0,3)]; n1=b-r(1,5); n2=r(100,400);}
        else {n1=r(100,900); n2=r(1000, 9999-n1);}

        correctAnswer = n1 + n2;
        document.getElementById('questionDisplay').innerText = `${n1} + ${n2}`;
        document.getElementById('qNum').innerText = currentCount;
        document.getElementById('mathInput').value = '';
        document.getElementById('mathInput').focus();
        qStartTime = Date.now();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInt);
        timerInt = setInterval(() => {
            document.getElementById('liveTimer').innerText = ((Date.now()-qStartTime)/1000).toFixed(1) + "s";
        }, 100);
    }

    document.getElementById('mathInput').addEventListener('input', (e) => {
        if(parseInt(e.target.value) === correctAnswer) {
            let timeTaken = (Date.now() - qStartTime) / 1000;
            sessionLogs.push({ q: document.getElementById('questionDisplay').innerText, t: timeTaken });
            currentCount++;
            nextQuestion();
        }
    });

    function showResults() {
        clearInterval(timerInt);
        showScreen('result');
        let avg = (sessionLogs.reduce((a,b)=>a+b.t, 0) / totalQs).toFixed(2);
        document.getElementById('avgRes').innerText = avg;

        const tbody = document.getElementById('resultBody');
        tbody.innerHTML = sessionLogs.map((l, i) => {
            let color = l.t < 3 ? 'var(--fast)' : (l.t < 6 ? 'var(--mid)' : 'var(--slow)');
            return `<tr><td>${i+1}</td><td>${l.q}</td><td><span class="tag" style="background:${color}">${l.t.toFixed(2)}s</span></td></tr>`;
        }).join('');

        historyData.push({ date: new Date().toLocaleDateString(), avg: parseFloat(avg) });
        localStorage.setItem('math_pro_history', JSON.stringify(historyData));
    }

    function downloadResult() {
        let csv = "Question,Time(s)\n" + sessionLogs.map(l => `${l.q.replace('+','-')},${l.t}`).join("\n");
        let blob = new Blob([csv], { type: 'text/csv' });
        let url = window.URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = `Math_Result_${new Date().getTime()}.csv`;
        a.click();
    }

    function showHistory() {
        showScreen('history');
        const ctx = document.getElementById('historyChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: historyData.map(h => h.date),
                datasets: [{ label: 'Avg Speed Trend', data: historyData.map(h => h.avg), borderColor: '#2563eb' }]
            }
        });
    }

    function r(min, max) { return Math.floor(Math.random() * (max - min + 1) + min); }
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function resetApp() { showScreen('setup'); }
</script>
</body>
</html>
